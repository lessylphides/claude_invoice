# 자동 테스트만 (배포는 Cloudflare: npm run deploy). GitHub Pages 배포는 2026-11 에 그만둠
name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 계산 로직 단위 테스트
        run: npm test
      - name: 브라우저 설치 (Chromium + 아이폰과 같은 엔진인 WebKit)
        run: npx playwright install --with-deps chromium webkit
      - name: 화면 흐름 테스트
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
