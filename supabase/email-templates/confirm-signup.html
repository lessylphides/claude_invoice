<!-- Supabase → Authentication → Emails → Templates → "Confirm signup"
     제목(Subject): [코스트노트] 인증 코드 {{ .Token }}
     인증 코드를 가입하던 화면에 넣으면 바로 로그인 (메일을 어느 앱에서 열든 상관없음). 버튼은 예전처럼 링크 인증 -->
<div style="max-width:480px;margin:0 auto;padding:24px 20px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1d2129;line-height:1.6">
  <h1 style="font-size:20px;margin:0 0 16px">코스트노트 가입을 환영해요</h1>
  <p style="margin:0 0 12px">가입하던 화면에 아래 <b>인증 코드</b>를 넣어 주세요.</p>
  <p style="margin:0 0 20px;font-size:32px;font-weight:800;letter-spacing:8px;color:#2459c4;background:#eef3fd;border-radius:12px;padding:14px 0;text-align:center">{{ .Token }}</p>
  <p style="margin:0 0 12px;font-size:14px;color:#636a77">가입하던 화면을 닫았다면, 아래 버튼을 눌러 인증한 뒤 코스트노트 앱에서 로그인해 주세요.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#2459c4;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px">이메일 인증하기</a>
  </p>
  <p style="margin:0;font-size:13px;color:#636a77">코드와 버튼은 1시간 동안만 쓸 수 있어요. 가입한 적이 없다면 이 메일은 무시하셔도 돼요.</p>
  <hr style="border:none;border-top:1px solid #e1e4ea;margin:24px 0 12px">
  <p style="margin:0;font-size:12px;color:#9aa0ab">코스트노트 · 매입·원가 관리 · app.costnote.co.kr</p>
</div>
